<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="500 0 700 300" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">VistaTrade</title>
  <desc id="d">Paper trading, a beginner course and an honest forecasting experiment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#120b1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d1428" stroke-width="1"/>
    </pattern>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A072"/>
      <stop offset="0.55" stop-color="#F0609E"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <clipPath id="cut">
      <rect x="820" y="40" width="260" height="104"/>
      <rect x="820" y="150" width="260" height="12"/>
      <rect x="820" y="168" width="260" height="8"/>
      <rect x="820" y="182" width="260" height="5"/>
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CCFC6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3CCFC6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.8"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#9B6BFF" stroke-opacity="0.35"/>

  <!-- striped Miami sunset -->
  <circle cx="950" cy="140" r="96" fill="url(#sun)" clip-path="url(#cut)" opacity="0.9"/>
  <path d="M640 196 H1170" stroke="#3CCFC6" stroke-width="2" stroke-linecap="round"/>

  <!-- price line over the horizon -->
  <path d="M640 250 L700 238 L740 244 L790 220 L830 228 L880 204 L920 212 L970 188 L1010 196 L1060 170 L1100 178 L1150 150 L1150 290 L640 290 Z" fill="url(#area)"/>
  <path d="M640 250 L700 238 L740 244 L790 220 L830 228 L880 204 L920 212 L970 188 L1010 196 L1060 170 L1100 178 L1150 150" fill="none" stroke="#3CCFC6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1150" cy="150" r="6" fill="#3CCFC6" stroke="#000" stroke-width="3"/>


  </svg>
